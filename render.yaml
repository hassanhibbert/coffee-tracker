# Render Blueprint: Postgres + the Spring Boot API (Docker).
# The React client is hosted separately on DreamHost (client/scripts/deploy.sh).
# In the Render dashboard: New > Blueprint > pick this repo.
databases:
  - name: coffee-tracker-db
    # Smallest paid plan: same size as free, but it doesn't expire after 30 days, and
    # Render allows only one free database per workspace. Max 100 connections.
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: oregon
    databaseName: coffee_tracker
    user: coffee_tracker

services:
  - type: web
    name: hassan-coffee-tracker-api
    runtime: docker
    # Smallest paid instance: same 512 MB as free, but always on (no cold starts).
    plan: 0.5c-512mb
    region: oregon
    # Monorepo: build from server/ and only redeploy when server files change.
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    buildFilter:
      paths:
        - server/**
    healthCheckPath: /actuator/health
    envVars:
      # Render hands over the parts; application.properties assembles the JDBC URL.
      - key: DB_HOST
        fromDatabase: { name: coffee-tracker-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: coffee-tracker-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: coffee-tracker-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: coffee-tracker-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: coffee-tracker-db, property: password }
      # Random 256-bit value generated by Render: never in Git, never typed by a human.
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_SIZE
        value: "5"
      # The client is served from a different origin, so the API must allow it explicitly.
      # Comma-separated, no spaces, if more than one is ever needed.
      - key: CORS_ALLOWED_ORIGINS
        value: https://coffee.hassanhibbert.com
