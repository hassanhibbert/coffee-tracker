# Render Blueprint: Postgres + the Spring Boot API (Docker) + the React client (static site).
# In the Render dashboard: New > Blueprint > pick this repo.
databases:
  - name: coffee-tracker-db
    plan: free
    region: oregon
    databaseName: coffee_tracker
    user: coffee_tracker

services:
  - type: web
    name: hassan-coffee-tracker-api
    runtime: docker
    plan: free
    region: oregon
    # Monorepo: build from server/ and only redeploy when server files change.
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    buildFilter:
      paths:
        - server/**
    healthCheckPath: /actuator/health
    envVars:
      # Render hands over the parts; application.properties assembles the JDBC URL.
      - key: DB_HOST
        fromDatabase: { name: coffee-tracker-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: coffee-tracker-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: coffee-tracker-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: coffee-tracker-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: coffee-tracker-db, property: password }
      # Random 256-bit value generated by Render: never in Git, never typed by a human.
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_SIZE
        value: "5"
      # The client is served from a different origin, so the API must allow it explicitly.
      # Render assigns <name>.onrender.com; if that name was taken, update both URLs below.
      - key: CORS_ALLOWED_ORIGINS
        value: https://hassan-coffee-tracker-client.onrender.com

  - type: web
    name: hassan-coffee-tracker-client
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: client/dist
    buildFilter:
      paths:
        - client/**
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Baked into the JavaScript bundle at build time (Vite replaces import.meta.env.*).
      # Only ever put public values in VITE_ variables: anyone can read the bundle.
      - key: VITE_API_BASE_URL
        value: https://hassan-coffee-tracker-api.onrender.com
    routes:
      # Single-page app: /brews/12/edit has no file on disk; serve index.html and let
      # React Router render the page.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Defence in depth for the token in sessionStorage: even if markup were injected,
      # the browser refuses to run scripts or send data anywhere but these origins.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://hassan-coffee-tracker-api.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
