# Loaded only by tests annotated @ActiveProfiles("test"), *on top of* the main
# application.properties. (A file named plain application.properties here would
# replace the main one entirely: a classic source of confusing test failures.)
app.jwt.secret=test-only-secret-not-used-anywhere-else-0123456789
app.cors.allowed-origins=http://localhost:5173
# Every MockMvc request comes from 127.0.0.1, so production limits would throttle the
# test suite itself. AuthRateLimitIntegrationTest sets its own low limits.
app.rate-limit.login-per-ip-per-minute=1000
app.rate-limit.login-per-username-per15-minutes=1000
app.rate-limit.register-per-ip-per-hour=1000
app.rate-limit.demo-per-ip-per-hour=1000
