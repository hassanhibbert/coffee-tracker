name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # GitHub's Ubuntu runners have Docker, so the Testcontainers tests run here
      # instead of being skipped.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t coffee-tracker .
